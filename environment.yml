name: airbnb-ml
channels:
  - pytorch
  - nvidia
  - conda-forge
  - defaults

dependencies:
  - python=3.10
  - pip

  # Core scientific computing
  - numpy>=1.24.0
  - pandas>=2.0.0
  - scipy>=1.10.0

  # Visualization
  - matplotlib>=3.7.0
  - seaborn>=0.12.0
  - plotly>=5.14.0

  # Jupyter
  - jupyterlab>=4.0.0
  - ipywidgets>=8.0.0
  - notebook>=7.0.0

  # Machine Learning
  - scikit-learn>=1.3.0

  # PyTorch (CPU version by default, GPU instructions below)
  - pytorch>=2.0.0
  - torchvision

  # Development tools
  - black
  - pre-commit

  # pip packages (not available via conda or newer versions)
  - pip:
    - hydra-core
    - tqdm
    - wandb
    - xgboost>=2.0.0
    - lightgbm>=4.0.0
    - tensorboard>=2.13.0
    - shap>=0.42.0
    - optuna>=3.2.0
